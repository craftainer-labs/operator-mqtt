{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "operator-mqtt.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    - admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-mqtt.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-mqtt-craftainer-dev-v1alpha1-mqttuser
  failurePolicy: Fail
  name: vmqttuser-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mqttusers
  sideEffects: None
{{- end }}
  name: {{ include "operator-mqtt.resourceName" (dict "suffix" "validating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-mqtt.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-mqtt-craftainer-dev-v1alpha1-clustermqttbroker
  failurePolicy: Fail
  name: vclustermqttbroker-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clustermqttbrokers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-mqtt.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-mqtt-craftainer-dev-v1alpha1-mqttbroker
  failurePolicy: Fail
  name: vmqttbroker-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mqttbrokers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-mqtt.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-mqtt-craftainer-dev-v1alpha1-mqttuser
  failurePolicy: Fail
  name: vmqttuser-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mqttusers
  sideEffects: None
{{- end }}
