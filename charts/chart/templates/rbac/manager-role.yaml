apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "operator-mqtt.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - clustermqttbrokers
  - mqttbrokers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - clustermqttbrokers/status
  - mqttbrokers/status
  - mqttusers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - mqttusers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - mqttusers/finalizers
  verbs:
  - update
