{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: mqttbrokers.mqtt.craftainer.dev
spec:
  group: mqtt.craftainer.dev
  names:
    categories:
    - craftainer
    kind: MqttBroker
    listKind: MqttBrokerList
    plural: mqttbrokers
    singular: mqttbroker
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MqttBroker is an MQTT broker that only claims in its own namespace
          may use.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of MqttBroker
            properties:
              adminCredentialsSecretRef:
                description: |-
                  AdminCredentialsSecretRef names the data-plane admin credentials. Unset
                  on a server that logs in with its cloud identity.
                properties:
                  key:
                    description: Key limits the credentials to one key of the Secret.
                    maxLength: 253
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is required on a cluster server (the operator namespace) and
                      forbidden on a namespaced one; the operator's own CEL enforces that.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              controlTopic:
                default: $CONTROL/dynamic-security/v1
                description: |-
                  controlTopic is the Dynamic Security control topic the operator
                  publishes its commands to.
                maxLength: 256
                type: string
                x-kubernetes-validations:
                - message: controlTopic must start with $CONTROL/
                  rule: self.startsWith('$CONTROL/')
                - message: 'controlTopic must not contain the wildcards + or #'
                  rule: '!self.contains(''+'') && !self.contains(''#'')'
              credentials:
                description: |-
                  credentials are the credentials to the cloud API: a Secret in the
                  broker's namespace (a namespaced broker cannot use WorkloadIdentity).
                properties:
                  secretRef:
                    description: SecretRef names the Secret in the server's own namespace.
                    properties:
                      name:
                        description: Name is the Secret's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace is the Secret's namespace: required on a cluster server (the
                          controller accepts only the operator's own namespace), forbidden on a
                          namespaced one.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  source:
                    description: Source must be Secret.
                    enum:
                    - WorkloadIdentity
                    - Secret
                    type: string
                required:
                - source
                type: object
                x-kubernetes-validations:
                - message: a namespaced server must use source Secret
                  rule: self.source == 'Secret'
                - message: secretRef is required
                  rule: has(self.secretRef)
                - message: secretRef.namespace is forbidden on a namespaced server
                  rule: '!has(self.secretRef) || !has(self.secretRef.namespace)'
              healthCheckInterval:
                description: |-
                  HealthCheckInterval is how often the server is probed (default 1m,
                  minimum 10s, maximum 1h).
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: healthCheckInterval must be between 10s and 1h
                  rule: duration(self) >= duration('10s') && duration(self) <= duration('1h')
              host:
                description: |-
                  host is the broker's host name or IP address. It never carries a scheme,
                  a port, a path or credentials: only letters, digits, dots, hyphens and
                  colons (for an IPv6 address) are allowed. It is required without
                  spec.provider; with one it overrides the discovered data endpoint (for
                  an emulator whose API and data plane are different processes).
                maxLength: 253
                minLength: 1
                pattern: ^[A-Za-z0-9.:-]+$
                type: string
              port:
                description: |-
                  port is the broker's TLS listener port. Unset means 8883 (the controller's
                  default, not the schema's, so a provider broker's discovered port can win).
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              protocol:
                description: |-
                  protocol selects MQTT over TLS or over WebSocket with TLS. Unset means
                  mqtts (the controller's default, not the schema's).
                enum:
                - mqtts
                - wss
                type: string
              provider:
                description: |-
                  provider says the broker is a managed cloud service (AWS IoT Core). Absent:
                  a self-hosted Mosquitto, as before. With a provider,
                  adminCredentialsSecretRef is forbidden.
                properties:
                  aws:
                    description: 'aws holds the AWS settings: region and an optional
                      role to assume.'
                    properties:
                      region:
                        description: Region is the AWS region; the partition follows
                          from it.
                        maxLength: 32
                        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                        type: string
                      roleARN:
                        description: RoleARN, when set, is assumed with the source
                          credentials.
                        maxLength: 2048
                        type: string
                        x-kubernetes-validations:
                        - message: 'roleARN must start with arn:'
                          rule: self.startsWith('arn:')
                    required:
                    - region
                    type: object
                  type:
                    description: type is the cloud. Only AWS is supported.
                    enum:
                    - AWS
                    - GCP
                    - Azure
                    type: string
                    x-kubernetes-validations:
                    - message: provider.type is immutable
                      rule: self == oldSelf
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: aws is required with type AWS and forbidden otherwise
                  rule: 'self.type == ''AWS'' ? has(self.aws) : !has(self.aws)'
              proxyURL:
                description: |-
                  ProxyURL is an http, https or socks5 proxy; unset uses the process
                  environment.
                maxLength: 512
                type: string
              tls:
                description: TLS configures verification of the backend.
                properties:
                  caBundle:
                    description: CABundle replaces the system roots.
                    properties:
                      configMapRef:
                        description: ConfigMapRef is a ConfigMap key holding a PEM
                          bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretRef:
                        description: SecretRef is a Secret key holding a PEM bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of secretRef and configMapRef
                      rule: has(self.secretRef) != has(self.configMapRef)
                  minVersion:
                    default: "1.2"
                    description: MinVersion is the TLS floor.
                    enum:
                    - "1.2"
                    - "1.3"
                    type: string
                  serverName:
                    description: ServerName overrides the host used for certificate
                      verification.
                    maxLength: 253
                    type: string
                type: object
              topicRoot:
                default: '{namespace}/'
                description: |-
                  topicRoot is the template of the topic prefix every tenant's ACL patterns
                  live under. The only placeholder is {namespace}. On a ClusterMqttBroker it
                  must contain {namespace}, so tenants' roots do not overlap; on an MqttBroker it
                  is optional. The default is "{namespace}/". It must end with a slash, must not
                  start with a slash, and must not contain an empty level (two slashes in a
                  row), "..", braces other than the placeholder, the MQTT wildcards plus sign
                  and hash, or a leading dollar sign. It is mutable.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: topicRoot must end with /
                  rule: self.endsWith('/')
                - message: topicRoot may only contain the placeholder {namespace}
                  rule: '!self.replace(''{namespace}'', '''').contains(''{'') && !self.replace(''{namespace}'',
                    '''').contains(''}'')'
                - message: 'topicRoot must not contain the wildcards + or # or start
                    with $'
                  rule: '!self.contains(''+'') && !self.contains(''#'') && !self.startsWith(''$'')'
                - message: topicRoot must not start with /, contain an empty topic
                    level (//) or contain ..
                  rule: '!self.startsWith(''/'') && !self.contains(''//'') && !self.contains(''..'')'
            type: object
            x-kubernetes-validations:
            - message: 'adminCredentialsSecretRef.namespace must not be set: the Secret
                is in the MqttBroker''s namespace'
              rule: '!has(self.adminCredentialsSecretRef) || !has(self.adminCredentialsSecretRef.namespace)'
            - message: adminCredentialsSecretRef is required without provider and
                forbidden with one
              rule: 'has(self.provider) ? !has(self.adminCredentialsSecretRef) : has(self.adminCredentialsSecretRef)'
            - message: host is required without provider
              rule: has(self.provider) || (has(self.host) && size(self.host) > 0)
            - message: only provider.type AWS is supported
              rule: '!has(self.provider) || self.provider.type == ''AWS'''
            - message: credentials is allowed only with provider
              rule: '!has(self.credentials) || has(self.provider)'
            - message: 'a namespaced broker with a provider must set credentials with
                source Secret: it cannot use WorkloadIdentity'
              rule: '!has(self.provider) || has(self.credentials)'
            - message: 'provider cannot be added or removed: a server cannot move
                between clouds or between cloud and self-hosted'
              rule: has(self.provider) == has(oldSelf.provider)
          status:
            description: status defines the observed state of MqttBroker
            properties:
              conditions:
                description: Conditions holds Ready and ServerReachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discovered:
                additionalProperties:
                  type: string
                description: |-
                  Discovered is what the operator read from the cloud for a cloud server:
                  endpoint, port, resourceId, accountId and region (ADR 0002, section
                  16.1). The probe (a cloud Prober of package probe) or the operator's
                  controller fills it; claims read it from the cached server. A
                  self-hosted server leaves it empty.
                maxProperties: 10
                type: object
                x-kubernetes-validations:
                - message: values are at most 512 characters
                  rule: self.all(k, size(self[k]) <= 512)
              lastProbeTime:
                description: LastProbeTime is when the server was last probed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
              serverVersion:
                description: ServerVersion is the version the backend reported.
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
