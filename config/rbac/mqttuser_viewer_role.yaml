# This rule is not used by the project operator-mqtt itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to mqtt.craftainer.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator-mqtt
    app.kubernetes.io/managed-by: kustomize
  name: mqttuser-viewer-role
rules:
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - mqttusers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mqtt.craftainer.dev
  resources:
  - mqttusers/status
  verbs:
  - get
