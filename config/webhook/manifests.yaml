---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-mqtt-craftainer-dev-v1alpha1-clustermqttbroker
  failurePolicy: Fail
  name: vclustermqttbroker-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clustermqttbrokers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-mqtt-craftainer-dev-v1alpha1-mqttbroker
  failurePolicy: Fail
  name: vmqttbroker-v1alpha1.kb.io
  rules:
  - apiGroups:
    - mqtt.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mqttbrokers
  sideEffects: None
