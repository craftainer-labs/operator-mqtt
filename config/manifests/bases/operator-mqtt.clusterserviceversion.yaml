apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Developer Tools
    description: A Kubernetes operator that provisions MQTT users and ACLs on Mosquitto brokers (mqtt.craftainer.dev).
    # Pod Security `restricted` and a suggested install namespace for OLM v0
    # (OLM v1 installs into the ClusterExtension's namespace).
    operatorframework.io/suggested-namespace: operator-mqtt-system
    # OpenShift infrastructure features (EB-5): "disconnected" is true when
    # every image the operator runs is listed in spec.relatedImages (the
    # bundle step pins and lists the manager image). Add "proxy-aware" once
    # the operator honours HTTP(S)_PROXY/NO_PROXY, and "fips-compliant" for a
    # build with GOFIPS140 (see the Dockerfile) run with GODEBUG=fips140=on.
    operators.openshift.io/infrastructure-features: '["disconnected"]'
    repository: https://github.com/craftainer-labs/operator-mqtt
  name: operator-mqtt.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: ClusterMqttBroker is a cluster-scoped MQTT broker that the namespaces in allowedNamespaces may claim from.
      displayName: Cluster Mqtt Broker
      kind: ClusterMqttBroker
      name: clustermqttbrokers.mqtt.craftainer.dev
      version: v1alpha1
    - description: MqttBroker is an MQTT broker that only claims in its own namespace may use.
      displayName: Mqtt Broker
      kind: MqttBroker
      name: mqttbrokers.mqtt.craftainer.dev
      version: v1alpha1
    - description: MqttUser is a user of an MQTT broker with ACLs under the tenant root, written to a binding Secret.
      displayName: Mqtt User
      kind: MqttUser
      name: mqttusers.mqtt.craftainer.dev
      version: v1alpha1
  description: |-
    Provisions MQTT users and their topic ACLs on a Mosquitto broker through
    Dynamic Security, from Kubernetes resources. A ClusterMqttBroker or
    MqttBroker names the broker and its admin credentials; an MqttUser in a
    team's namespace claims from it, with ACL patterns under the tenant's
    topic root.
  displayName: MQTT Operator
  install:
    spec:
      deployments: null
    strategy: ""
  # AllNamespaces is the only mode OLM v1 (ClusterExtension) installs without
  # legacy compatibility; OLM v0 supports it too.
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - operator
  - craftainer
  links:
  - name: Source
    url: https://github.com/craftainer-labs/operator-mqtt
  maintainers:
  - email: maintainers@example.com
    name: Maintainers
  maturity: alpha
  minKubeVersion: 1.33.0
  provider:
    name: craftainer
    url: https://github.com/craftainer
  # The manager image is added by `make bundle` (scripts/bundle-fixup.sh) with
  # the digest it was built for.
  relatedImages: []
  version: 0.0.0
