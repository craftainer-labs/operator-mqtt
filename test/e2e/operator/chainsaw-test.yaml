# Installs the Helm chart into a Pod Security `restricted` namespace, with the
# manager running as an arbitrary UID, then exercises the mqtt.craftainer.dev API
# end to end: the CRDs, their defaults and the webhooks (the controllers come
# later). The steps run in order; the cluster is thrown away afterwards.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: operator
spec:
  namespaceTemplate:
    metadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
  steps:
    - name: install the chart
      try:
        - script:
            timeout: 5m
            env:
              - name: RELEASE
                value: operator-mqtt
            content: |
              set -eu
              helm upgrade --install "$RELEASE" "$E2E_CHART_DIR" --namespace "$NAMESPACE" \
                --set manager.image.registry= \
                --set manager.image.repository="$E2E_IMAGE_REPOSITORY" \
                --set manager.image.tag="$E2E_IMAGE_TAG" \
                --set manager.image.pullPolicy=Never \
                --set manager.podSecurityContext.runAsUser=12345 \
                --wait --timeout 4m
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator-mqtt-controller-manager
              status:
                availableReplicas: 1
      cleanup:
        - script:
            content: helm uninstall operator-mqtt --namespace "$NAMESPACE" --ignore-not-found

    - name: runs as an arbitrary UID with leader election
      try:
        - script:
            content: |
              set -eu
              uid=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.securityContext.runAsUser}')
              test "$uid" = 12345
              ro=$(kubectl get pods -n "$NAMESPACE" -l control-plane=controller-manager -o jsonpath='{.items[0].spec.containers[0].securityContext.readOnlyRootFilesystem}')
              test "$ro" = true
        - assert:
            resource:
              apiVersion: coordination.k8s.io/v1
              kind: Lease
              metadata:
                name: operator-mqtt.craftainer.dev
              (spec.holderIdentity != null): true

    - name: the CRDs are established
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              for crd in clustermqttbrokers mqttbrokers mqttusers; do
                kubectl wait --for=condition=Established --timeout=60s "crd/${crd}.mqtt.craftainer.dev"
              done

    - name: an MqttBroker gets its schema defaults
      try:
        - apply:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttBroker
              metadata:
                name: broker
              spec:
                host: mosquitto.example.svc
                adminCredentialsSecretRef:
                  name: broker-admin
        - assert:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttBroker
              metadata:
                name: broker
              spec:
                port: 8883
                protocol: mqtts
                controlTopic: $CONTROL/dynamic-security/v1
                topicRoot: '{namespace}/'

    - name: the webhook rejects a proxy URL with credentials without echoing it
      try:
        - apply:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttBroker
              metadata:
                name: bad-proxy
              spec:
                host: mosquitto.example.svc
                proxyURL: http://user:hunter2@proxy:3128
                adminCredentialsSecretRef:
                  name: broker-admin
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must not carry credentials')): true
                  (contains($error, 'hunter2')): false

    - name: an MqttUser gets its default ACL and the schema rejects a topic that leaves the tenant root
      try:
        - apply:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttUser
              metadata:
                name: gateway
              spec:
                serverRef: {kind: MqttBroker, name: broker}
        - assert:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttUser
              metadata:
                name: gateway
              spec:
                acls:
                  - topic: '#'
                    access: PublishSubscribe
                maxConnections: -1
        - apply:
            resource:
              apiVersion: mqtt.craftainer.dev/v1alpha1
              kind: MqttUser
              metadata:
                name: escape
              spec:
                serverRef: {kind: MqttBroker, name: broker}
                acls:
                  - {topic: '$SYS/#', access: Subscribe}
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must not start with $')): true

    - name: metrics need a token
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              svc="operator-mqtt-controller-manager-metrics-service.${NAMESPACE}.svc:8443"
              kubectl create serviceaccount metrics-client -n "$NAMESPACE"
              kubectl create clusterrolebinding "e2e-metrics-${NAMESPACE}" \
                --clusterrole=operator-mqtt-metrics-reader --serviceaccount="${NAMESPACE}:metrics-client"
              token=$(kubectl create token metrics-client -n "$NAMESPACE")
              # curl runs in `default`: the test namespace enforces `restricted`.
              kubectl run "metrics-curl" -n default --rm -i --restart=Never \
                --image=curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40 \
                --command -- sh -c "
                  anon=\$(curl -ks -o /dev/null -w '%{http_code}' https://${svc}/metrics)
                  echo anonymous=\$anon
                  test \"\$anon\" = 401 -o \"\$anon\" = 403
                  curl -ks -H 'Authorization: Bearer ${token}' https://${svc}/metrics > /tmp/m
                  grep -q -E '^(go|process)_' /tmp/m
                  echo authenticated metrics ok"
      cleanup:
        - script:
            content: kubectl delete clusterrolebinding "e2e-metrics-${NAMESPACE}" --ignore-not-found
