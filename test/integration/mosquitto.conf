# The Mosquitto of the integration lane (test/integration/README.md): one TLS
# listener, no anonymous access, and the Dynamic Security plugin for logins and
# ACLs. The same file runs in CI and in the devcontainer stack; the paths are
# those of the compose service and of the docker run in
# .github/workflows/integration.yml.
per_listener_settings false
allow_anonymous false

listener 8883
certfile /tls/server.crt
keyfile /tls/server.key

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence false
# $SYS statistics every 2 seconds, so the compose health check, which reads
# one, passes soon after start.
sys_interval 2
log_dest stdout
